<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/static/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenIQ - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/translations.js"></script>
    <script src="/static/language.js"></script>
    <script src="/static/theme.js"></script>
    <style>
        :root {
            --primary-green: #2e7d32;
            --primary-hover: #1b5e20;
        }
        body {
            background: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }
        .auth-container {
            max-width: 500px;
            width: 100%;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h2 {
            color: var(--primary-green);
            font-weight: 700;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px;
        }
        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
        }
        .btn-primary {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .auth-footer {
            text-align: center;
            margin-top: 25px;
        }
        .auth-footer a {
            color: var(--primary-green);
            font-weight: 600;
            text-decoration: none;
        }
        .alert {
            display: none;
            border-radius: 8px;
        }
        .nav-controls {
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
    <div class="nav-controls d-flex">
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="language_selector">
                Language
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('en')" data-i18n="english">English</a></li>
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('es')" data-i18n="spanish">Spanish</a></li>
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('fr')" data-i18n="french">French</a></li>
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('hi')" data-i18n="hindi">Hindi</a></li>
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('mai')" data-i18n="maithili">Maithili</a></li>
            </ul>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <h2 data-i18n="register_title">Join GreenIQ</h2>
            <p class="text-muted" data-i18n="register_subtitle">Create an account for smart farming insights</p>
        </div>
        
        <div class="alert alert-danger" id="error-message" role="alert"></div>
        <div class="alert alert-success" id="success-message" role="alert"></div>
        
        <form id="register-form">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label" data-i18n="name">Full Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="occupation" class="form-label" data-i18n="occupation">Occupation</label>
                    <input type="text" class="form-control" id="occupation" placeholder="e.g. Farmer" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label" data-i18n="email_address">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="phone_number" class="form-label" data-i18n="phone">Phone Number</label>
                <input type="tel" class="form-control" id="phone_number" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label" data-i18n="password">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="confirm_password" class="form-label" data-i18n="password">Confirm</label>
                    <input type="password" class="form-control" id="confirm_password" required>
                </div>
            </div>
            <div class="d-grid gap-2 mt-2">
                <button type="submit" class="btn btn-primary" data-i18n="register_button">Create Account</button>
            </div>
        </form>
        
        <div class="auth-footer">
            <p><span data-i18n="have_account">Already a member?</span> <a href="login.html" data-i18n="login_link">Login</a></p>
            <a href="/" class="text-muted small"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = (typeof window !== 'undefined' && window.BACKEND_URL ? String(window.BACKEND_URL) : '').replace(/\/$/, '');

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const occupation = document.getElementById('occupation').value;
            const phone_number = document.getElementById('phone_number').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            errorMessage.style.display = 'none';
            if (password !== confirm_password) {
                errorMessage.textContent = 'Passwords do not match.';
                errorMessage.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, occupation, phone_number, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    successMessage.textContent = 'Account created! Redirecting...';
                    successMessage.style.display = 'block';
                    localStorage.setItem('userEmail', email);
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    errorMessage.textContent = data.error || 'Registration failed.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Connection error. Try again later.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
