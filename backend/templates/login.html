<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login - GreenIQ</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/static/styles.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
	<script src="/static/translations.js"></script>
	<script src="/static/language.js"></script>
	<script src="/static/theme.js"></script>
</head>
<body class="p-4">
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container-fluid">
			<a class="navbar-brand" href="/">GreenIQ</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<!-- Language Selector -->
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="language_selector">Language</a>
						<ul class="dropdown-menu" aria-labelledby="languageDropdown">
							<li><a class="dropdown-item" href="#" onclick="changeLanguage('es')" data-i18n="spanish">Spanish</a></li>
							<li><a class="dropdown-item" href="#" onclick="changeLanguage('fr')" data-i18n="french">French</a></li>
							<li><a class="dropdown-item" href="#" onclick="changeLanguage('hi')" data-i18n="hindi">Hindi</a></li>
						</ul>
					</li>
					<!-- Theme Selector -->
					<li class="nav-item dropdown theme-selector">
						<a class="nav-link dropdown-toggle" href="#" id="themeDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
							<i class="bi bi-palette-fill"></i> <span>Theme</span>
						</a>
						<ul class="dropdown-menu" aria-labelledby="themeDropdown">
							<li><a class="dropdown-item theme-option" href="#" data-theme="light" onclick="changeTheme('light')"><span class="theme-icon light"></span> Light Mode</a></li>
							<li><a class="dropdown-item theme-option" href="#" data-theme="dark" onclick="changeTheme('dark')"><span class="theme-icon dark"></span> Dark Mode</a></li>
							<li><a class="dropdown-item theme-option" href="#" data-theme="nightLight" onclick="changeTheme('nightLight')"><span class="theme-icon night-light"></span> Night Light Mode</a></li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>
    <div class="container" style="max-width:480px;">
        <h1 class="mb-3">Login</h1>
        <div class="alert alert-danger" id="error-message" role="alert" style="display:none"></div>
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Toggle password visibility">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100">Login</button>
        </form>
        <p class="mt-3">No account? <a href="/register.html">Register</a></p>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = (typeof window !== 'undefined' && window.BACKEND_URL ? String(window.BACKEND_URL) : '').replace(/\/$/, '');
window.ALLOW_BOGUS_LOGIN = true;
// Password visibility toggle
document.getElementById('toggle-password').addEventListener('click', function() {
    const passwordInput = document.getElementById('password');
    const icon = this.querySelector('i');
    if (passwordInput.type === 'password') {
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        passwordInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
});

document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMessage = document.getElementById('error-message');
    errorMessage.style.display = 'none';
    try {
        const response = await fetch(`${API_BASE}/api/login/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
            credentials: 'include'
        });
        const data = await response.json();
        if (response.ok && data.success) {
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/';
        } else {
            if (window.ALLOW_BOGUS_LOGIN) {
                const name = email.split('@')[0] || 'User';
                const demoUser = { email, name, occupation: 'Demo' };
                localStorage.setItem('user', JSON.stringify(demoUser));
                window.location.href = '/';
            } else {
                errorMessage.textContent = data.error || 'Login failed. Please check your credentials.';
                errorMessage.style.display = 'block';
            }
        }
    } catch (err) {
        if (window.ALLOW_BOGUS_LOGIN) {
            const name = email.split('@')[0] || 'User';
            const demoUser = { email, name, occupation: 'Demo' };
            localStorage.setItem('user', JSON.stringify(demoUser));
            window.location.href = '/';
        } else {
            errorMessage.textContent = 'An error occurred. Please try again later.';
            errorMessage.style.display = 'block';
        }
    }
});
</script>
</body>
</html>
