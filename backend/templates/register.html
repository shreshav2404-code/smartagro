<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Register - GreenIQ</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/static/styles.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
	<script src="/static/translations.js"></script>
	<script src="/static/language.js"></script>
	<script src="/static/theme.js"></script>
</head>
<body class="p-4">
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container-fluid">
			<a class="navbar-brand" href="/">GreenIQ</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<!-- Language Selector -->
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="language_selector">Language</a>
						<ul class="dropdown-menu" aria-labelledby="languageDropdown">
							<li><a class="dropdown-item" href="#" onclick="changeLanguage('es')" data-i18n="spanish">Spanish</a></li>
							<li><a class="dropdown-item" href="#" onclick="changeLanguage('fr')" data-i18n="french">French</a></li>
							<li><a class="dropdown-item" href="#" onclick="changeLanguage('hi')" data-i18n="hindi">Hindi</a></li>
						</ul>
					</li>
					<!-- Theme Selector -->
					<li class="nav-item dropdown theme-selector">
						<a class="nav-link dropdown-toggle" href="#" id="themeDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
							<i class="bi bi-palette-fill"></i> <span>Theme</span>
						</a>
						<ul class="dropdown-menu" aria-labelledby="themeDropdown">
							<li><a class="dropdown-item theme-option" href="#" data-theme="light" onclick="changeTheme('light')"><span class="theme-icon light"></span> Light Mode</a></li>
							<li><a class="dropdown-item theme-option" href="#" data-theme="dark" onclick="changeTheme('dark')"><span class="theme-icon dark"></span> Dark Mode</a></li>
							<li><a class="dropdown-item theme-option" href="#" data-theme="nightLight" onclick="changeTheme('nightLight')"><span class="theme-icon night-light"></span> Night Light Mode</a></li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>
	<div class="container" style="max-width:480px;">
		<h1 class="mb-3">Register</h1>
		<div class="alert alert-danger" id="error-message" role="alert" style="display:none"></div>
		<div class="alert alert-success" id="success-message" role="alert" style="display:none"></div>
		<form id="register-form">
			<div class="mb-3">
				<label class="form-label" for="name">Full Name</label>
				<input type="text" id="name" class="form-control" placeholder="Your name" required>
			</div>
			<div class="mb-3">
				<label class="form-label" for="email">Email</label>
				<input type="email" id="email" class="form-control" placeholder="you@example.com" required>
			</div>
			<div class="mb-3">
				<label class="form-label" for="occupation">Occupation</label>
				<input type="text" id="occupation" class="form-control" placeholder="Farmer, Agronomist, etc." required>
			</div>
			<div class="mb-3">
				<label class="form-label" for="phone">Phone Number</label>
				<input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
			</div>
			<div class="mb-3">
				<label class="form-label" for="password">Password</label>
				<input type="password" id="password" class="form-control" placeholder="••••••••" required>
			</div>
			<button type="submit" class="btn btn-success w-100">Create Account</button>
		</form>
		<p class="mt-3">Already have an account? <a href="/login.html">Login</a></p>
	</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = (typeof window !== 'undefined' && window.BACKEND_URL ? String(window.BACKEND_URL) : '').replace(/\/$/, '');
document.getElementById('register-form').addEventListener('submit', async function(e) {
	e.preventDefault();
	const name = document.getElementById('name').value.trim();
	const email = document.getElementById('email').value.trim();
	const occupation = document.getElementById('occupation').value.trim();
	const phone_number = document.getElementById('phone').value.trim();
	const password = document.getElementById('password').value;
	const errorMessage = document.getElementById('error-message');
	const successMessage = document.getElementById('success-message');
	errorMessage.style.display = 'none';
	successMessage.style.display = 'none';
	try {
		const response = await fetch(`${API_BASE}/api/register/`, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ name, email, occupation, phone_number, password }),
			credentials: 'include'
		});
		const data = await response.json();
		if (response.ok && data.success) {
			successMessage.textContent = 'Registration successful. Redirecting to login...';
			successMessage.style.display = 'block';
			setTimeout(() => { window.location.href = '/login.html'; }, 1200);
		} else {
			errorMessage.textContent = data.error || 'Registration failed. Please check your details.';
			errorMessage.style.display = 'block';
		}
	} catch (err) {
		console.error('Register error:', err);
		errorMessage.textContent = 'An error occurred. Please try again later.';
		errorMessage.style.display = 'block';
	}
});
</script>
</body>
</html>
