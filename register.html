<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/static/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenIQ - Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/translations.js"></script>
    <script src="/static/language.js"></script>
    <script src="/static/theme.js"></script>
    <style>
        .auth-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h2 {
            color: #2e7d32;
        }
        .form-control:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
        }
        .btn-primary {
            background-color: #2e7d32;
            border-color: #2e7d32;
        }
        .btn-primary:hover {
            background-color: #1b5e20;
            border-color: #1b5e20;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
        }
        .auth-footer a {
            color: #2e7d32;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .alert {
            display: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Navigation Bar -->
        <div class="d-flex justify-content-end mt-3">
            <!-- Language Selector -->
            <div class="dropdown me-2">
                <button class="btn btn-sm btn-outline-success dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="language_selector">
                    Language
                </button>
                <ul class="dropdown-menu" aria-labelledby="languageDropdown">
                    <li><a class="dropdown-item" href="#" onclick="changeLanguage('en')" data-i18n="english">English</a></li>
                    <li><a class="dropdown-item" href="#" onclick="changeLanguage('es')" data-i18n="spanish">Spanish</a></li>
                    <li><a class="dropdown-item" href="#" onclick="changeLanguage('fr')" data-i18n="french">French</a></li>
                    <li><a class="dropdown-item" href="#" onclick="changeLanguage('hi')" data-i18n="hindi">Hindi</a></li>
                </ul>
            </div>
            <!-- Theme Selector -->
            <div class="dropdown theme-selector">
                <button class="btn btn-sm btn-outline-success dropdown-toggle" type="button" id="themeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Theme
                </button>
                <ul class="dropdown-menu" aria-labelledby="themeDropdown">
                    <li><a class="dropdown-item theme-option" href="#" data-theme="light" onclick="changeTheme('light')"><span class="theme-icon light"></span> Light Mode</a></li>
                    <li><a class="dropdown-item theme-option" href="#" data-theme="dark" onclick="changeTheme('dark')"><span class="theme-icon dark"></span> Dark Mode</a></li>
                    <li><a class="dropdown-item theme-option" href="#" data-theme="nightLight" onclick="changeTheme('nightLight')"><span class="theme-icon night-light"></span> Night Light Mode</a></li>
                </ul>
            </div>
        </div>
        
        <div class="auth-container">
            <div class="auth-header">
                <h2 data-i18n="register_title">Create Your GreenIQ Account</h2>
                <p data-i18n="register_subtitle">Join our smart farming community</p>
            </div>
            
            <div class="alert alert-danger" id="error-message" role="alert"></div>
            <div class="alert alert-success" id="success-message" role="alert"></div>
            
            <form id="register-form">
                <div class="mb-3">
                    <label for="name" class="form-label" data-i18n="name">Full Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label" data-i18n="email_address">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="occupation" class="form-label" data-i18n="occupation">Occupation</label>
                    <input type="text" class="form-control" id="occupation" required>
                </div>
                <div class="mb-3">
                    <label for="phone_number" class="form-label" data-i18n="phone">Phone Number</label>
                    <input type="tel" class="form-control" id="phone_number" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" data-i18n="password">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label" data-i18n="password">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary" data-i18n="register_button">Create Account</button>
                </div>
            </form>
            
            <div class="auth-footer">
                <p><span data-i18n="have_account">Already have an account?</span> <a href="login.html" data-i18n="login_link">Login</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const occupation = document.getElementById('occupation').value;
            const phone_number = document.getElementById('phone_number').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            // Reset messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Validate passwords match
            if (password !== confirm_password) {
                errorMessage.textContent = 'Passwords do not match.';
                errorMessage.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('http://20.244.80.78:8000/api/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        occupation,
                        phone_number,
                        password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Registration successful
                    successMessage.textContent = 'Registration successful! Redirecting to login page...';
                    successMessage.style.display = 'block';
                    
                    // Store user data in localStorage if needed
                    localStorage.setItem('userEmail', email);
                    
                    // Redirect to login page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    // Registration failed
                    errorMessage.textContent = data.error || 'Registration failed. Please try again.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'An error occurred. Please try again later.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
