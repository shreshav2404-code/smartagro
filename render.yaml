services:
  - type: web
    name: smartagro-backend
    env: python
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd backend
      gunicorn --bind 0.0.0.0:10000 backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SUPABASE_DB_URL
        value: postgresql://postgres.dvtabjxxflpvyuarczcc:@Keshav2404@aws-1-ap-south-1.pooler.supabase.com:6543/postgres
      - key: GEMINI_API_KEY
        value: YOUR_GEMINI_API_KEY
      - key: GROQ_API_KEY
        value: YOUR_GROQ_API_KEY
      - key: AZURE_OPENAI_ENDPOINT
        value: https://keshuai.services.ai.azure.com/
      - key: AZURE_OPENAI_KEY
        value: ATJ3QNVGVjPpXWUsKAG2k4vCcXicCdREL06DLnZtoLuVAMHHuljQJQQJ99CBACGhslBXJ3w3AAAAACOGp9WK
      - key: OPENWEATHERMAP_API_KEY
        value: YOUR_OPENWEATHERMAP_API_KEY
      - key: DJANGO_SECRET_KEY
        value: YOUR_DJANGO_SECRET_KEY
      - key: HF_TOKEN
        value: YOUR_HF_TOKEN
      - key: OPENROUTER_API_KEY
        value: YOUR_OPENROUTER_API_KEY
      - key: NVIDIA_API_KEY
        value: YOUR_NVIDIA_API_KEY
      - key: SESSION_COOKIE_SECURE
