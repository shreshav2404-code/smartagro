<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenIQ - Image Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .analysis-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .image-preview {
            max-width: 100%;
            max-height: 400px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .analysis-result {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GreenIQ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container analysis-container my-5">
        <h1 class="text-center mb-4">Agricultural Image Analysis</h1>
        <p class="lead text-center">Upload an image of your crops or plants for AI-powered analysis</p>
        
        <form id="image-analysis-form" class="mt-4">
            <div class="mb-3">
                <label for="image-upload" class="form-label">Select Image</label>
                <input type="file" class="form-control" id="image-upload" name="image" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Additional Information (optional)</label>
                <textarea class="form-control" id="message" name="message" rows="3" placeholder="Describe what you want to know about this image..."></textarea>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Analyze Image</button>
            </div>
        </form>
        
        <div id="preview-container" class="text-center" style="display: none;">
            <h3 class="mt-4">Image Preview</h3>
            <img id="image-preview" class="image-preview" src="" alt="Preview">
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Analyzing image...</p>
        </div>
        
        <div id="result-container" style="display: none;">
            <h3 class="mt-4">Analysis Results</h3>
            <div id="image-info" class="mb-2 text-muted"></div>
            <div id="analysis-result" class="analysis-result"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('image-analysis-form');
            const imageUpload = document.getElementById('image-upload');
            const previewContainer = document.getElementById('preview-container');
            const imagePreview = document.getElementById('image-preview');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const imageInfo = document.getElementById('image-info');
            const analysisResult = document.getElementById('analysis-result');
            
            // Show image preview when file is selected
            imageUpload.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        previewContainer.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                }
            });
            
            // Handle form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const formData = new FormData();
                formData.append('image', imageUpload.files[0]);
                formData.append('message', document.getElementById('message').value);
                
                // Show loading indicator
                loading.style.display = 'block';
                resultContainer.style.display = 'none';
                
                try {
                    const response = await fetch('/api/ai_assistant_image/', {
                        method: 'POST',
                        body: formData
                    });
                    // Try to parse JSON regardless of status to show useful error details
                    let data;
                    try {
                        data = await response.json();
                    } catch(parseErr) {
                        throw new Error(`Unexpected response format (status ${response.status}).`);
                    }
                    
                    // Display results
                    // Clear prior info
                    imageInfo.textContent = '';
                    // Prefer backend standard 'reply'
                    if (data.reply) {
                        analysisResult.textContent = data.reply;
                    } else if (data.analysis) {
                        analysisResult.textContent = data.analysis;
                    } else if (data.error) {
                        analysisResult.textContent = `Error: ${data.error}`;
                    } else {
                        analysisResult.textContent = 'No analysis results available.';
                    }
                    
                    resultContainer.style.display = 'block';
                    
                    // Reset the form and image preview after successful analysis
                    form.reset();
                    previewContainer.style.display = 'none';
                } catch (error) {
                    console.error('Error:', error);
                    analysisResult.textContent = `Error: ${error.message}`;
                    resultContainer.style.display = 'block';
                } finally {
                    // Hide loading indicator
                    loading.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
