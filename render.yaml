services:
  - type: web
    name: smartagro-backend
    env: python
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd backend
      gunicorn --bind 0.0.0.0:10000 backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SUPABASE_DB_URL
        value: postgresql://postgres:YOUR_DB_PASSWORD@db.dvtabjxxflpvyuarczcc.supabase.co:5432/postgres
      - key: GEMINI_API_KEY
        value: ""  # Set in Render dashboard
      - key: GROQ_API_KEY
        value: ""  # Set in Render dashboard
      - key: AZURE_OPENAI_ENDPOINT
        value: ""  # Set in Render dashboard if needed
      - key: AZURE_OPENAI_KEY
        value: ""  # Set in Render dashboard if needed
      - key: OPENWEATHERMAP_API_KEY
        value: ""  # Set in Render dashboard
      - key: DJANGO_SECRET_KEY
        value: ""  # Set in Render dashboard
