<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/static/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenIQ - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/translations.js"></script>
    <script src="/static/language.js"></script>
    <script src="/static/theme.js"></script>
    <style>
        :root {
            --primary-green: #2e7d32;
            --primary-hover: #1b5e20;
        }
        body {
            background: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .auth-container {
            max-width: 450px;
            width: 100%;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h2 {
            color: var(--primary-green);
            font-weight: 700;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
        }
        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
        }
        .btn-primary {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .btn-demo {
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
        }
        .btn-demo:hover {
            background-color: #e0e0e0;
        }
        .auth-footer {
            text-align: center;
            margin-top: 25px;
        }
        .auth-footer a {
            color: var(--primary-green);
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .alert {
            display: none;
            border-radius: 8px;
        }
        .nav-controls {
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
    <div class="nav-controls d-flex">
        <div class="dropdown me-2">
            <button class="btn btn-sm btn-outline-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="language_selector">
                Language
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('en')" data-i18n="english">English</a></li>
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('es')" data-i18n="spanish">Spanish</a></li>
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('fr')" data-i18n="french">French</a></li>
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('hi')" data-i18n="hindi">Hindi</a></li>
                <li><a class="dropdown-item" href="#" onclick="changeLanguage('mai')" data-i18n="maithili">Maithili</a></li>
            </ul>
        </div>
        <button class="btn btn-sm btn-outline-success" onclick="toggleTheme()" id="theme-toggle">
            <i class="bi bi-moon-fill"></i>
        </button>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <h2 data-i18n="welcome">GreenIQ</h2>
            <p class="text-muted" data-i18n="login_subtitle">Login to your smart farming dashboard</p>
        </div>
        
        <div class="alert alert-danger" id="error-message" role="alert"></div>
        
        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label" data-i18n="email_address">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label" data-i18n="password">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" data-i18n="login_button">Login</button>
                <button type="button" id="demo-login-btn" class="btn btn-demo">
                    <i class="bi bi-play-fill me-1"></i> Demo Login
                </button>
            </div>
        </form>
        
        <div class="auth-footer">
            <p><span data-i18n="no_account">New here?</span> <a href="register.html" data-i18n="create_account">Create Account</a></p>
            <a href="/" class="text-muted small"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = (typeof window !== 'undefined' && window.BACKEND_URL ? String(window.BACKEND_URL) : '').replace(/\/$/, '');

        // Pre-fill email from registration
        document.addEventListener('DOMContentLoaded', function() {
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail) {
                document.getElementById('email').value = userEmail;
                localStorage.removeItem('userEmail');
            }
        });

        // Theme toggle
        function toggleTheme() {
            const currentTheme = localStorage.getItem('theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            changeTheme(newTheme);
        }

        // Password visibility toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        // Demo login handler
        document.getElementById('demo-login-btn').addEventListener('click', function() {
            const demoUser = { email: 'demo@greeniq.ai', name: 'Demo Farmer', occupation: 'Farmer' };
            localStorage.setItem('user', JSON.stringify(demoUser));
            window.location.href = '/';
        });

        // Form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            try {
                const response = await fetch(`${API_BASE}/api/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = data.error || 'Login failed.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Connection error. Try again later.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
