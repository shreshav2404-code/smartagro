<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenIQ - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/translations.js"></script>
    <script src="/static/language.js"></script>
    <script src="/static/theme.js"></script>
    <style>
        .auth-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h2 {
            color: #2e7d32;
        }
        .form-control:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
        }
        .btn-primary {
            background-color: #2e7d32;
            border-color: #2e7d32;
        }
        .btn-primary:hover {
            background-color: #1b5e20;
            border-color: #1b5e20;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
        }
        .auth-footer a {
            color: #2e7d32;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .alert {
            display: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Navigation Bar -->
        <div class="d-flex justify-content-end mt-3">
            <!-- Language Selector -->
            <div class="dropdown me-2">
                <button class="btn btn-sm btn-outline-success dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="language_selector">
                    Language
                </button>
                <ul class="dropdown-menu" aria-labelledby="languageDropdown">
                    <li><a class="dropdown-item" href="#" onclick="changeLanguage('en')" data-i18n="english">English</a></li>
                    <li><a class="dropdown-item" href="#" onclick="changeLanguage('es')" data-i18n="spanish">Spanish</a></li>
                    <li><a class="dropdown-item" href="#" onclick="changeLanguage('fr')" data-i18n="french">French</a></li>
                    <li><a class="dropdown-item" href="#" onclick="changeLanguage('hi')" data-i18n="hindi">Hindi</a></li>
                </ul>
            </div>
            <!-- Theme Selector -->
            <div class="dropdown theme-selector">
                <button class="btn btn-sm btn-outline-success dropdown-toggle" type="button" id="themeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Theme
                </button>
                <ul class="dropdown-menu" aria-labelledby="themeDropdown">
                    <li><a class="dropdown-item theme-option" href="#" data-theme="light" onclick="changeTheme('light')"><span class="theme-icon light"></span> Light Mode</a></li>
                    <li><a class="dropdown-item theme-option" href="#" data-theme="dark" onclick="changeTheme('dark')"><span class="theme-icon dark"></span> Dark Mode</a></li>
                    <li><a class="dropdown-item theme-option" href="#" data-theme="nightLight" onclick="changeTheme('nightLight')"><span class="theme-icon night-light"></span> Night Light Mode</a></li>
                </ul>
            </div>
        </div>
        
        <div class="auth-container">
            <div class="auth-header">
                <h2 data-i18n="welcome">Welcome to GreenIQ</h2>
                <p data-i18n="login_subtitle">Login to access your smart farming dashboard</p>
            </div>
            
            <div class="alert alert-danger" id="error-message" role="alert"></div>
            
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label" data-i18n="email_address">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" data-i18n="password">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary" data-i18n="login_button">Login</button>
                </div>
            </form>
            
            <div class="auth-footer">
                <p><span data-i18n="no_account">Don't have an account?</span> <a href="register.html" data-i18n="create_account">Create Account</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if coming from registration page and pre-fill email
        document.addEventListener('DOMContentLoaded', function() {
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail) {
                document.getElementById('email').value = userEmail;
                // Clear it after using it
                localStorage.removeItem('userEmail');
            }
        });

        // Password visibility toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Login successful
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/'; // Redirect to home page
                } else {
                    // Login failed
                    errorMessage.textContent = data.error || 'Login failed. Please check your credentials.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'An error occurred. Please try again later.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
