    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --bg-gradient: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
        }
        body {
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .login-split {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .login-sidebar {
            flex: 1;
            background: var(--bg-gradient);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            text-align: center;
        }
        .login-content {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: white;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
        }
        .sidebar-logo {
            font-size: 3.5rem;

        }
        .sidebar-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 15px;
        }
        .sidebar-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 400px;
        }
        .form-label {
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        .form-control:focus {
            background-color: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
        }
        .btn-login {
            background-color: var(--primary);
            border: none;
            padding: 14px;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn-demo {
            background-color: #f0f0f0;
            border: none;
            color: #555;
            margin-top: 15px;
        }
        .btn-demo:hover {
            background-color: #e5e5e5;
            color: #333;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #aaa;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;

        .divider:not(:empty)::after { margin-left: 1em; }

        @media (max-width: 992px) {

<body>
    <div class="login-split">
        <div class="login-sidebar">
            <div class="sidebar-logo">🌾</div>
            <h1 class="sidebar-title">GreenIQ</h1>
            <p class="sidebar-subtitle">Empowering farmers with AI-driven insights, real-time weather, and a sustainable marketplace.</p>
        </div>
        <div class="login-content">
            <div class="login-card">
                <div class="mb-4">
                    <h2 class="fw-bold mb-1">Welcome Back</h2>
                    <p class="text-muted">Enter your credentials to access your dashboard</p>
                </div>

                <div class="alert alert-danger" id="error-message" style="display:none; border-radius:10px;"></div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label">Password</label>
                            <a href="#" class="text-decoration-none small text-success">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggle-password" style="border-radius: 0 10px 10px 0; border: 1px solid #ddd; background: #f9f9f9;">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-login">Sign In</button>
                    </div>
                </form>

                <div class="divider">OR</div>

                <div class="d-grid">
                    <button id="demo-login-btn" class="btn btn-login btn-demo">
                        <i class="bi bi-person-badge me-2"></i> Continue as Guest
                    </button>
                </div>

                <div class="mt-5 text-center">
                    <p class="text-muted">Don't have an account? <a href="register.html" class="text-success fw-bold text-decoration-none">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = (typeof window !== 'undefined' && window.BACKEND_URL ? String(window.BACKEND_URL) : '').replace(/\/$/, '');

        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            const icon = this.querySelector('i');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        // Demo Login
        document.getElementById('demo-login-btn').addEventListener('click', function() {
            const demoUser = { email: 'guest@greeniq.ai', name: 'Guest Farmer', occupation: 'Guest' };
            localStorage.setItem('user', JSON.stringify(demoUser));
            window.location.href = 'dashboard.html';
        });

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            errorDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/api/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Authentication failed.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Is the backend running?';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
